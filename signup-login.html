<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up & Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-auth.js"></script>
    <script>
      // Firebase config and initialization
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };
      const app = firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
    </script>
</head>
<body style="background-color: #1fdddd; margin: 0; padding: 0; font-family: Arial, sans-serif;">
    <header style="text-align: center; padding: 20px; background-color: #ffffff;">
        <h1 style="color: #333; font-size: 2.2rem;">Sign up now to unlock premium features and get started with us!</h1>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div style="display: flex; justify-content: space-between; gap: 20px; width: 100%; max-width: 800px;">

            <!-- Sign Up Form Block -->
            <div style="background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 300px;">
                <h1 style="text-align: center; color: hsla(199, 88%, 43%, 0.699);">Create an Account</h1>
                <form id="signup-form">
                    <label for="username" style="display: block; margin: 8px 0 4px; color: #555;"><h3>Username</h3></label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    
                    <label for="email" style="display: block; margin: 8px 0 4px; color: #555;"><h3>Email</h3></label>
                    <input type="email" id="email" name="email" required placeholder="Enter you email" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    
                    <label for="password" style="display: block; margin: 8px 0 4px; color: #555;"><h3>Password</h3></label>
                    <input type="password" id="password" name="password" required placeholder="Create a password" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    
                    <button type="submit" style="width: 100%; padding: 10px; background-color: teal; color: white; border: none; border-radius: 4px; cursor: pointer;">Sign Up</button>
                </form>
            </div>

            <!-- Login Form Block -->
            <div style="background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 300px;">
                <h1 style="text-align: center; color: hsla(199, 88%, 43%, 0.699);">Login</h1>
                <form id="login-form">
                    <label for="login-email" style="display: block; margin: 8px 0 4px; color: #555;"><h3>Email</h3></label>
                    <input type="email" id="login-email" name="email" required placeholder="Enter your email" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    
                    <label for="login-password" style="display: block; margin: 8px 0 4px; color: #555;"><h3>Password</h3></label>
                    <input type="password" id="login-password" name="password" required placeholder="Enter your password" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    
                    <button type="submit" style="width: 100%; padding: 10px; background-color: teal; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
                </form>
            </div>

        </div>
    </main>

    <footer style="text-align: center; padding: 10px; background-color: #ffffff;">
        <p style="color: #333;">Already have an account? <a href="#login" style="color: teal; text-decoration: none;">Login</a></p>
        <p style="color: #333;">Don’t have an account? <a href="#signup" style="color: teal; text-decoration: none;">Sign Up</a></p>
    </footer>
</body>
</html>
